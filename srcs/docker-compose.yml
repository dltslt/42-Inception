# pssssssst don't tell anyone
# ------------------------------------------------------------------------------
secrets:
  mysql:
    file: ../secrets/mysql.txt
  wp_db:
    file: ../secrets/wp_db.txt
  wp_admin:
    file: ../secrets/wp_admin.txt
  wp_user:
    file: ../secrets/wp_user.txt

# services
# ------------------------------------------------------------------------------
services:
# -- nginx ----------------------------
  nginx:
    depends_on:
      - wordpress
    env_file: .env
    build:
      context: ./requirements/nginx
      args:
        - A_DOMAIN_NAME=$DOMAIN_NAME
        - A_WP_PATH=$WP_PATH
    image: nginx
    container_name: nginx
    restart: always
    volumes:
      - wordpress-disk:/var/www/html
    ports:
      - "80:80"
      - "443:443"
    networks:
      - inception
# -- wordpress ------------------------
  wordpress:
    depends_on:
      - mariadb
    env_file: .env
    build:
      context: ./requirements/wordpress
      args:
        - A_WP_PATH=$WP_PATH
    image: wordpress
    container_name: wordpress
    restart: always
    volumes:
      - wordpress-disk:/var/www/html
    networks:
      - inception
    expose:
      - "9000"
    secrets:
      - mysql
      - wp_db
      - wp_admin
      - wp_user
# -- mariadb --------------------------
  mariadb:
    env_file: .env
    build:
      context: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: always
    volumes:
      - database-disk:/var/lib/mysql
    networks:
      - inception
    expose:
      - "3306"
    secrets:
      - mysql

# persistent volumes
# ------------------------------------------------------------------------------
volumes:
  database-disk:
    driver: local
    driver_opts:
      type: none
      #device: /home/mweghofe/data/database
      device: ../archive/database
      o: bind
  wordpress-disk:
    driver: local
    driver_opts:
      type: none
      #device: /home/mweghofe/data/database
      device: ../archive/wordpress
      o: bind

# networks
# ------------------------------------------------------------------------------
networks:
  inception:
    driver: bridge
