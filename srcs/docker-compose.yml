secrets:
  mysql_pwd:
    file: ../secrets/mysql_pwd.txt
  wp_admin:
    file: ../secrets/wp_admin.txt

services:           # the containers to run ...
  nginx:
    env_file: .env
    build:
      context: ./requirements/nginx
      args:
        - DOMAIN_NAME=$DOMAIN_NAME
        - WP_PATH=$WP_PATH
    image: nginx
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - inception
  
  wordpress:
    env_file: .env
    build:
      context: ./requirements/wordpress
      args:
        - DOMAIN_NAME=$DOMAIN_NAME
        - WP_PATH=$WP_PATH
    image: wordpress
    container_name: wordpress
    restart: always
    ports:
      - "9000:9000"
    networks:
      - inception
    secrets:
      - mysql_pwd

#volumes:            # named volumes ...

networks:           # named networks ...
  inception:
    driver: bridge
