# pssssssst don't tell anyone
# ------------------------------------------------------------------------------
secrets:
  mysql:
    file: ../secrets/mysql.txt
  wp_db:
    file: ../secrets/wp_db.txt
  wp_admin:
    file: ../secrets/wp_admin.txt
  wp_user:
    file: ../secrets/wp_user.txt

# services
# ------------------------------------------------------------------------------
services:
# -- nginx ----------------------------
  nginx:
    env_file: .env
    build:
      context: ./requirements/nginx
      args:
        - DOMAIN_NAME=$DOMAIN_NAME
        - WP_PATH=$WP_PATH
    image: nginx
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - inception
# -- wordpress ------------------------
  wordpress:
    env_file: .env
    build:
      context: ./requirements/wordpress
      args:
        - DOMAIN_NAME=$DOMAIN_NAME
        - WP_PATH=$WP_PATH
    image: wordpress
    container_name: wordpress
    restart: always
    networks:
      - inception
    expose:
      - "9000"
    secrets:
      - mysql
      - wp_db
      - wp_admin
      - wp_user
# -- mariadb --------------------------
  mariadb:
    env_file: .env
    build:
      context: ./requirements/mariadb
     # args:
    image: mariadb
    container_name: mariadb
    restart: always
    networks:
      - inception
    expose:
      - "3306"
    secrets:
      - mysql

# persistent volumes
# ------------------------------------------------------------------------------
# volumes:

# networks
# ------------------------------------------------------------------------------
networks:
  inception:
    driver: bridge
