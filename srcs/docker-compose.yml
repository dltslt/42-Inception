# pssssssst don't tell anyone
# ------------------------------------------------------------------------------
secrets:
  ftp:
    file: ../secrets/ftp.txt
  mysql:
    file: ../secrets/mysql.txt
  wp_db:
    file: ../secrets/wp_db.txt
  wp_admin:
    file: ../secrets/wp_admin.txt
  wp_user:
    file: ../secrets/wp_user.txt

# services
# ------------------------------------------------------------------------------
services:
# -- nginx ----------------------------
  inception_nginx:
    env_file: .env
    build:
      context: ./requirements/nginx
      args:
        - A_DOMAIN_NAME=$DOMAIN_NAME
        - A_WP_PATH=$WP_PATH
    image: inception_nginx
    container_name: inception_nginx
    restart: always
    depends_on:
      - inception_wordpress
    volumes:
      - wordpress-disk:/var/www/html
    ports:
      - "80:80"
      - "443:443"
    networks:
      - inception_network
# -- wordpress ------------------------
  inception_wordpress:
    env_file: .env
    build:
      context: ./requirements/wordpress
      args:
        - A_WP_PATH=$WP_PATH
    image: inception_wordpress
    container_name: inception_wordpress
    restart: always
    depends_on:
      - inception_mariadb
    volumes:
      - wordpress-disk:/var/www/html
    networks:
      - inception_network
    expose:
      - "9000"
    secrets:
      - mysql
      - wp_db
      - wp_admin
      - wp_user
# -- mariadb --------------------------
  inception_mariadb:
    env_file: .env
    build:
      context: ./requirements/mariadb
    image: inception_mariadb
    container_name: inception_mariadb
    restart: always
    volumes:
      - database-disk:/var/lib/mysql
    networks:
      - inception_network
    expose:
      - "3306"
    secrets:
      - mysql
# -- ftp ------------------------- B --
  inception_ftp:
    env_file: .env
    build:
      context: ./requirements/bonus/ftp
    image: inception_ftp
    container_name: inception_ftp
    restart: always
    depends_on:
      - inception_wordpress
    volumes:
      - wordpress-disk:/var/www/html
    networks:
      - inception_network
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    secrets:
      - ftp
# -- adminer --------------------- B --
  inception_adminer:
    env_file: .env
    build:
      context: ./requirements/bonus/adminer
    image: inception_adminer
    container_name: inception_adminer
    restart: always
    depends_on:
      - inception_mariadb
    networks:
      - inception_network
    ports:
      - "8081:8081"

# persistent volumes
# ------------------------------------------------------------------------------
volumes:
  database-disk:
    driver: local
    driver_opts:
      type: none
      #device: /home/mweghofe/data/mariadb
      device: ../data/mariadb
      o: bind
  wordpress-disk:
    driver: local
    driver_opts:
      type: none
      #device: /home/mweghofe/data/wordpress
      device: ../data/wordpress
      o: bind

# networks
# ------------------------------------------------------------------------------
networks:
  inception_network:
    driver: bridge
