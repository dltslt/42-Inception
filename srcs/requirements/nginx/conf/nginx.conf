server {
    # setting up TLS requirements
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name  __DOMAIN_NAME__;
    ssl_certificate     /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # wordpress files are here
    root  __WP_PATH__;
    index index.php;

    # how to handle files
    location / {
        # first check as real file
        # then as a directory
        # then pass to wordpress's index.php
        # this allows wordpress pretty urls
        try_files $uri $uri/ /index.php?$args;
    }

    # Pass PHP files to WordPress/PHP-FPM
    location ~ \.php$ {
        # only execute .php files that actually exist
        try_files $uri =404;

        # include the standard FastCGI parameters
        include       fastcgi_params;

        # split path at .php
        # eg. /index.php/users/42
        #  index.php = script_name
        #  /users/42 = path_info
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Forward to the WordPress container on port 9000
        # "wordpress" is resolved by Docker's internal DNS
        fastcgi_pass  wordpress:9000;
        fastcgi_index index.php;

        # Tell PHP-FPM the full path to the script
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name __DOMAIN_NAME__;

    return 301 https://$host$request_uri;
}
