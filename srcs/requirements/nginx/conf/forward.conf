# "hardcoding" the target in the map doesn't work for caddy_
upstream caddy_ {
	server inception_website:8443;
}

# matches a responsible server to a domain
map $ssl_preread_server_name $backend {
	__DOMAIN_NAME__ 127.0.0.1:4443;
	~^.+\.__DOMAIN_NAME__ caddy_;
	default 127.0.0.1:9443;
}

server {
    listen 443;
    proxy_pass $backend;
	ssl_preread on;
}

# black hole: accepts and immediately closes
server {
    listen 127.0.0.1:9443;
	return "404";
}

# forward all http to caddy
server {
	listen 80;
	proxy_pass inception_website:80;
}
