# Bind to all interfaces so WordPress container can connect
bind 0.0.0.0

# Default port
port 6379

# Disable persistence — this is a cache, not a database
# If Redis restarts, WordPress rebuilds from MariaDB
save ""
appendonly no

# Memory cap — prevent Redis from consuming unlimited RAM
maxmemory 256mb

# Eviction policy: remove least-recently-used keys when maxmemory is reached
# Correct choice for a cache where all keys are equally evictable
maxmemory-policy allkeys-lru

# Require a password for connections (optional but good practice)
# Set this to match WP_REDIS_PASSWORD in your .env
# requirepass yourredispassword
protected-mode no

# Logging
loglevel notice
logfile ""