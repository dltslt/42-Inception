{
    debug
}

*.__DOMAIN_NAME__:8443 {
	# certificate
	tls internal
	tls {
        protocols tls1.2 tls1.3
    }
	# log output
	log {
        output file /var/log/caddy/access.log
        level DEBUG
    }
	# individual domains
    @static_website host static.__DOMAIN_NAME__
	# handle domains
    handle @static_website {
		root * /srv/www
    	file_server
    }
	# fallback
	handle {
        respond "no page for this URL" 200
    }
}

*.__DOMAIN_NAME__:80 {
    @static_website host static.__DOMAIN_NAME__
	log {
        output file /var/log/caddy/access.log
        level DEBUG
    }
    handle @static_website {
        root * /srv/www
        file_server
    }

    handle {
        respond "caddy alive" 200
    }
}
