[www]

; user and group for the service to run as
user  = www-data
group = www-data

; where to listen, need to change from local socket to wordpress:9000
listen = 0.0.0.0:9000

; process pool size => how many workers
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
